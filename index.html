<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Usha — Photo wayfinding for the last hundred meters</title>
    <meta name="description" content="Help your customers find your studio with photo-led directions. Build a wayfinding page in minutes.">
    <meta name="author" content="Usha" />


    <!-- Link preview (Open Graph + Twitter). Image URLs must stay absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://usha.live" />
    <meta property="og:title" content="Usha — Find the door in the last 100 meters" />
    <meta property="og:description" content="Short video guides that walk first-time visitors from the street to your door, through the courtyard." />
    <meta property="og:image" content="https://usha.live/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Usha: a short video guide that walks you from the street to the door." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Usha — Find the door in the last 100 meters" />
    <meta name="twitter:description" content="Short video guides that walk first-time visitors from the street to your door, through the courtyard." />
    <meta name="twitter:image" content="https://usha.live/og-image-v2.png" />
    <meta name="twitter:image:alt" content="Usha: a short video guide that walks you from the street to the door." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Geist / Geist Mono: landing page ("/") only. Scoped via the
         usha-landing-heading/usha-landing-mono classes in landing.css, not
         the shared Tailwind font-display/font-sans families, so this has no
         effect on the wizard, dashboard, auth or walker screens. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Umami analytics. Loads on every route (SPA shell); auto-tracks pageviews,
       which already separates "/" from each "/find/:slug" by path. The website
       id is injected from VITE_UMAMI_WEBSITE_ID (see .env) so it is not
       hardcoded here and stays easy to change. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="%VITE_UMAMI_WEBSITE_ID%"></script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
